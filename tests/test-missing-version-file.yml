name: Test missing version file falls back to python-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: '3.10'
          python-version-file: does-not-exist/.python-version
      - name: Assert python 3.10 installed from input
        run: |
          ACTUAL="$(python --version 2>&1)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            "Python 3.10."*) ;;
            *) echo "FAIL: expected Python 3.10.x"; exit 1 ;;
          esac
          if [ ! -d "$HOME/.setup-python-amazon-linux/.python-versions/3.10" ]; then
            echo "FAIL: install dir for 3.10 missing"
            exit 1
          fi
          echo "PASS"
